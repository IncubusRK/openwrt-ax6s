# Build OpenWrt for Xiaomi Redmi AX6S / AX3200 — branch openwrt-25.12 (apk).
#
# Triggers:
#   - push to main touching the recipe (seeds/files/scripts/diy/workflow)
#   - repository_dispatch "upstream-update" from update-checker.yml
#     (works with GITHUB_TOKEN — no PAT needed)
#   - workflow_dispatch (manual)
#
# Releases: dated tags 25.12-YYYY.MM.DD-HHMM, keep 3 per prefix.
# Assets: sysupgrade .itb, factory .bin, ubi-loader .itb, manifest,
#         extra-packages.tar.gz (packages built but NOT in the image).
#
# Notes:
#   - The composition is verified after the build (scripts/verify-build.sh):
#     third-party packages are cloned at HEAD, and a silent drop must fail CI.
#   - dl/ + ccache are cached: sing-box (podkop-engine), zapret2 and Argon are
#     Go/C/LuaJIT builds and dominate the build time.

name: Build OpenWrt

on:
  push:
    branches: [main]
    paths:
      - 'seeds/**'
      - 'files/**'
      - 'scripts/**'
      - 'diy-part*.sh'
      - '.gitattributes'
      - '.github/workflows/build.yml'
  repository_dispatch:
    types: [upstream-update]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  SEED: seeds/full-2512.config
  TZ: Asia/Yekaterinburg
  TGT: mediatek/mt7622
  IMG: openwrt-mediatek-mt7622-xiaomi_redmi-router-ax6s

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout recipe
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -hT

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses5-dev libssl-dev libelf-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget ccache
          sudo timedatectl set-timezone "$TZ"

      - name: Prepare workdir (fixed path for cache reuse)
        run: |
          sudo mkdir -p /workdir
          sudo chown "$USER" /workdir

      - name: Restore dl + ccache
        uses: actions/cache/restore@v4
        with:
          path: |
            /workdir/openwrt/dl
            /home/runner/.ccache
          key: openwrt-25.12-${{ github.run_id }}
          restore-keys: |
            openwrt-25.12-

      - name: Clone OpenWrt
        run: |
          # Cache restore above may have created /workdir/openwrt/dl already;
          # cloning straight into a non-empty dir fails. Clone into a scratch
          # dir and merge, preserving the cached dl/.
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" /workdir/openwrt-src
          mkdir -p /workdir/openwrt
          rsync -a /workdir/openwrt-src/ /workdir/openwrt/
          rm -rf /workdir/openwrt-src
          git -C /workdir/openwrt rev-parse HEAD > /workdir/openwrt-head.txt
          cat /workdir/openwrt-head.txt

      - name: Load custom feeds (diy-part1)
        run: |
          chmod +x diy-part1.sh
          cd /workdir/openwrt
          "$GITHUB_WORKSPACE/diy-part1.sh"

      - name: Update feeds
        run: cd /workdir/openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd /workdir/openwrt && ./scripts/feeds install -a

      - name: Load files and seed config
        run: |
          cp -a files /workdir/openwrt/files
          # uci-defaults are only executed when executable; a Windows checkout
          # may lose the bit.
          chmod 0755 /workdir/openwrt/files/etc/uci-defaults/*
          cp "$SEED" /workdir/openwrt/.config
          echo 'CONFIG_CCACHE=y' >> /workdir/openwrt/.config
          # rules.mk exports CCACHE_DIR=$(TOPDIR)/.ccache unless CONFIG_CCACHE_DIR
          # is set — point it at the cached path, otherwise ccache never persists.
          echo 'CONFIG_CCACHE_DIR="/home/runner/.ccache"' >> /workdir/openwrt/.config

      - name: Custom packages (diy-part2)
        run: |
          chmod +x diy-part2.sh
          cd /workdir/openwrt
          "$GITHUB_WORKSPACE/diy-part2.sh"

      - name: Defconfig and download
        run: |
          cd /workdir/openwrt
          make defconfig
          # catch silent drops of the packages the whole recipe exists for
          grep -q '^CONFIG_CCACHE=y' .config || echo "::warning::ccache was dropped by defconfig"
          for p in zapret2 podkop podkop-engine; do
            grep -q "^CONFIG_PACKAGE_$p=y" .config || { echo "ERROR: $p dropped by defconfig" >&2; exit 1; }
          done
          if grep -q '^CONFIG_PACKAGE_sing-box=y' .config; then
            echo "ERROR: sing-box selected alongside podkop-engine" >&2
            exit 1
          fi
          make download -j8
          # Only prune root-level failed-download placeholders. NEVER descend
          # into dl/go-mod-cache: .info/.mod/.ziphash files there are <1K and
          # deleting them corrupts the restored Go module cache.
          find dl -maxdepth 1 -type f -size -1024c -exec rm -f {} \;

      - name: Compile
        run: |
          cd /workdir/openwrt
          export CCACHE_DIR=/home/runner/.ccache
          export CCACHE_MAXSIZE=3G
          echo "$(nproc) threads"
          make -j"$(nproc)" || make -j1 V=s
          ccache -s || true

      # Save the cache even when a later step fails: otherwise every failed
      # verification costs a full rebuild on the next attempt.
      - name: Save dl + ccache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            /workdir/openwrt/dl
            /home/runner/.ccache
          key: openwrt-25.12-${{ github.run_id }}

      - name: Verify build
        run: |
          cd /workdir/openwrt
          T="bin/targets/$TGT"
          ls -la "$T"
          # Device-specific config -> PROFILE_SANITIZED is set, so the manifest
          # carries the device suffix. Resolve it instead of guessing.
          MAN=$(ls -1 "$T"/*.manifest 2>/dev/null | head -n 1 || true)
          [ -n "$MAN" ] || { echo "ERROR: no manifest in $T" >&2; exit 1; }
          echo "manifest: $MAN"
          bash "$GITHUB_WORKSPACE/scripts/verify-build.sh" "$MAN"
          ITB="$T/${IMG}-squashfs-sysupgrade.itb"
          FACTORY="$T/${IMG}-factory.bin"
          test -f "$ITB"
          test -f "$FACTORY"
          # Hard size guard: the UBI partition on the AX6S is ~114 MiB, and the
          # image has to leave room for the overlay.
          for f in "$ITB" "$FACTORY"; do
            sz=$(stat -c%s "$f")
            echo "$(basename "$f"): $sz bytes"
            [ "$sz" -lt 100663296 ] || { echo "ERROR: $f exceeds 96 MiB" >&2; exit 1; }
          done

      - name: Organize artifacts
        run: |
          cd /workdir/openwrt
          T="bin/targets/$TGT"
          OUT=/workdir/out
          mkdir -p "$OUT/meta"
          MAN=$(ls -1 "$T"/*.manifest 2>/dev/null | head -n 1 || true)
          [ -n "$MAN" ] || { echo "ERROR: no manifest in $T" >&2; exit 1; }
          cp "$T/${IMG}-squashfs-sysupgrade.itb" \
             "$T/${IMG}-factory.bin" \
             "$T/${IMG}-ubi-loader.itb" "$OUT/"
          # stable asset name regardless of the per-device manifest suffix
          cp "$MAN" "$OUT/openwrt-mediatek-mt7622.manifest"
          cp /workdir/openwrt-head.txt repo-heads.txt "$OUT/meta/"
          bash "$GITHUB_WORKSPACE/scripts/extra-packages.sh" \
            "$MAN" bin/packages "$OUT/extra-packages.tar.gz"
          (cd "$OUT" && sha256sum ./*.itb ./*.bin ./*.tar.gz > meta/asset-sha256.txt)
          ls -la "$OUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: /workdir/out
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="25.12-$(date +%Y.%m.%d-%H%M)"
          ITB=out/openwrt-mediatek-mt7622-xiaomi_redmi-router-ax6s-squashfs-sysupgrade.itb
          FACTORY=out/openwrt-mediatek-mt7622-xiaomi_redmi-router-ax6s-factory.bin
          UPSTREAM=$(cat out/meta/openwrt-head.txt)
          {
            echo "# OpenWrt 25.12 (AX6S) — $(date +%Y-%m-%d)"
            echo
            echo "Upstream: \`openwrt-25.12\` @ \`$UPSTREAM\`"
            echo
            echo "## Assets"
            echo "- sysupgrade: $(stat -c%s "$ITB") bytes, sha256 \`$(sha256sum "$ITB" | cut -d' ' -f1)\`"
            echo "- factory: $(stat -c%s "$FACTORY") bytes, sha256 \`$(sha256sum "$FACTORY" | cut -d' ' -f1)\`"
            echo "- extra-packages.tar.gz: $(stat -c%s out/extra-packages.tar.gz) bytes (built but NOT in the image)"
            echo
            echo "## Custom repo HEADs"
            echo '```'
            cat out/meta/repo-heads.txt
            echo '```'
            echo
            echo "First boot: all transparent proxies are disabled — enable exactly ONE intercept (zapret2 or podkop) in LuCI."
            echo "Optional packages: \`tar -xzf extra-packages.tar.gz -C /tmp/extra && apk add --allow-untrusted /tmp/extra/*.apk\` (same release as the image!)."
          } > body.md
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "OpenWrt 25.12 (AX6S) $(date +%Y-%m-%d)" \
            --notes-file body.md \
            "$ITB" "$FACTORY" \
            out/openwrt-mediatek-mt7622-xiaomi_redmi-router-ax6s-ubi-loader.itb \
            out/openwrt-mediatek-mt7622.manifest \
            out/meta/asset-sha256.txt \
            out/extra-packages.tar.gz

      - name: Retention (keep 3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("25.12-"))][3:][].tagName' | \
          while read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
          done